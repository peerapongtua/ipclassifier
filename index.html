<style>
  :root {
    --ink: #1C2B3A;
    --bg: #F3EFE6;
    --card-bg: #FBF9F4;
    --card-bg-2: #EFE9DA;
    --brass: #8A6A32;
    --brass-strong: #6E5326;
    --brass-bg: #ECE1C8;
    --line: #D8D0BE;
    --muted: #6B6559;
    --forest: #33513C;
    --forest-bg: #E3EADD;
    --rust: #7C3A34;
    --rust-bg: #F1E1DD;
    --focus: #8A6A32;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #EAE4D6; --bg: #141B22; --card-bg: #1C2531; --card-bg-2: #212C3A;
      --brass: #C9A055; --brass-strong: #E0B76B; --brass-bg: #362C1B; --line: #33404D;
      --muted: #9BA3AC; --forest: #86C39A; --forest-bg: #1F332A; --rust: #D98A82; --rust-bg: #362222; --focus: #C9A055;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EAE4D6; --bg: #141B22; --card-bg: #1C2531; --card-bg-2: #212C3A;
    --brass: #C9A055; --brass-strong: #E0B76B; --brass-bg: #362C1B; --line: #33404D;
    --muted: #9BA3AC; --forest: #86C39A; --forest-bg: #1F332A; --rust: #D98A82; --rust-bg: #362222; --focus: #C9A055;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: auto; margin: 0; background: var(--bg); color: var(--ink); font-family: 'Leelawadee UI','Noto Sans Thai','Thonburi','Tahoma','Segoe UI',sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top,0px) env(safe-area-inset-left,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-right,0px); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  a { color: var(--brass-strong); }

  .skip-link {
    position: absolute; left: 12px; top: -60px; z-index: 1000;
    background: var(--brass); color: var(--card-bg);
    padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
    transition: top 0.15s ease;
  }
  .skip-link:focus { top: 12px; }

  /* ---------- Disclaimer bar ---------- */
  .disclaimer-bar {
    background: var(--brass-bg);

      desc: { th: "ใช้กับสัญลักษณ์ที่ใช้แยกแยะการให้บริการของคุณจากผู้ให้บริการรายอื่น เช่น เครื่องหมายของร้านอาหาร โรงแรม หรือบริษัทที่ปรึกษา", en: "Used for a symbol that distinguishes your services from other providers, e.g. a mark for a restaurant, hotel, or consulting firm." },
      law: { th: "พระราชบัญญัติเครื่องหมายการค้า พ.ศ. 2534", en: "Trademark Act B.E. 2534 (1991)" },
      term: { th: "10 ปีนับจากวันจดทะเบียน ต่ออายุได้ครั้งละ 10 ปี ไม่จำกัดจำนวนครั้ง", en: "10 years from registration, renewable indefinitely in 10-year terms" },
      advice: { th: ["จัดจำพวกบริการให้ตรงตามประเภทกิจการที่ให้บริการจริง", "ยื่นคำขอจดทะเบียนต่อกรมทรัพย์สินทางปัญญา (DIP) กระทรวงพาณิชย์", "เก็บหลักฐานการใช้เครื่องหมายในการให้บริการอย่างต่อเนื่อง"], en: ["Classify the services accurately to match your actual business", "File the registration application with the DIP, Ministry of Commerce", "Keep evidence of continuous use of the mark in providing services"] },
      overlap: { th: ["หากมีการออกแบบพื้นที่ให้บริการหรือสิ่งของประกอบที่มีเอกลักษณ์เฉพาะ อาจพิจารณาความคุ้มครองด้านอื่นเพิ่มเติม เช่น ลิขสิทธิ์งานตกแต่ง"], en: ["If the service space or associated items have a distinctive design, consider additional protection such as copyright for the decor"] } },
    certification_mark: { title: { th: "เครื่องหมายรับรอง", en: "Certification Mark" }, icon: "trademark", roadmap: "trademark",
      desc: { th: "ใช้รับรองคุณภาพ วัตถุดิบ แหล่งกำเนิด หรือมาตรฐานของสินค้าหรือบริการของผู้อื่น เช่น เครื่องหมายมาตรฐาน หรือเครื่องหมายฮาลาล", en: "Used to certify the quality, material, origin, or standard of someone else's goods or services, e.g. a standards mark or a halal mark." },
      law: { th: "พระราชบัญญัติเครื่องหมายการค้า พ.ศ. 2534 หมวดเครื่องหมายรับรอง", en: "Trademark Act B.E. 2534 (1991), certification mark provisions" },
      term: { th: "10 ปีนับจากวันจดทะเบียน ต่ออายุได้ครั้งละ 10 ปี", en: "10 years from registration, renewable in 10-year terms" },
      advice: { th: ["ผู้ขอจดทะเบียนต้องไม่ใช่ผู้ผลิตสินค้าที่ขอรับรองเอง เพื่อความเป็นกลาง", "ต้องกำหนดหลักเกณฑ์และมาตรฐานการรับรองแนบท้ายคำขออย่างชัดเจน", "ควบคุมและตรวจสอบผู้ใช้เครื่องหมายให้เป็นไปตามหลักเกณฑ์อย่างสม่ำเสมอ"], en: ["The applicant must not itself be the producer of the certified goods, to preserve neutrality", "Clear certification standards and criteria must be attached to the application", "Regularly monitor and audit users of the mark for compliance with the criteria"] }, overlap: { th: [], en: [] } },
    collective_mark: { title: { th: "เครื่องหมายร่วม", en: "Collective Mark" }, icon: "trademark", roadmap: "trademark",
      desc: { th: "ใช้โดยสมาชิกของสมาคม สหกรณ์ สหภาพ หรือกลุ่มบุคคล เพื่อแสดงว่าสินค้าหรือบริการมาจากสมาชิกในกลุ่มเดียวกัน", en: "Used by members of an association, cooperative, union, or group to show that goods or services come from members of the same group." },
      law: { th: "พระราชบัญญัติเครื่องหมายการค้า พ.ศ. 2534 หมวดเครื่องหมายร่วม", en: "Trademark Act B.E. 2534 (1991), collective mark provisions" },
      term: { th: "10 ปีนับจากวันจดทะเบียน ต่ออายุได้ครั้งละ 10 ปี", en: "10 years from registration, renewable in 10-year terms" },
      advice: { th: ["ผู้ขอต้องเป็นนิติบุคคลประเภทสมาคม สหกรณ์ สหภาพ หรือกลุ่มบุคคลที่กฎหมายรับรอง", "ต้องมีระเบียบการใช้เครื่องหมายร่วมกันในกลุ่มสมาชิกแนบท้ายคำขอ"], en: ["The applicant must be a legal entity such as an association, cooperative, union, or a legally recognized group", "Rules governing joint use of the mark among members must be attached to the application"] }, overlap: { th: [], en: [] } },
    trade_name: { title: { th: "ชื่อทางการค้า", en: "Trade Name" }, icon: "trademark", roadmap: "tradename",
      desc: { th: "ชื่อที่ใช้เรียกกิจการหรือธุรกิจ ไม่ใช่ตัวสินค้าหรือบริการ ได้รับความคุ้มครองจากการใช้จริงในทางการค้า", en: "The name used to refer to a business or enterprise, not the goods or services themselves; protected through actual use in trade." },
      law: { th: "หลักกฎหมายทั่วไปว่าด้วยละเมิดและการแข่งขันทางการค้าที่ไม่เป็นธรรม ประกอบอนุสัญญากรุงปารีส", en: "General tort and unfair competition law principles, together with the Paris Convention" },
      term: { th: "ไม่มีกำหนดเวลา คุ้มครองตราบเท่าที่ยังมีการใช้ชื่อในทางการค้าอย่างต่อเนื่อง", en: "No fixed term; protected for as long as the name continues to be used in trade" },
      advice: { th: ["ไม่ต้องยื่นจดทะเบียนเพื่อให้เกิดสิทธิ แต่ควรเก็บหลักฐานการใช้ชื่ออย่างต่อเนื่องไว้เสมอ", "ควรพิจารณาจดทะเบียนชื่อเดียวกันเป็นเครื่องหมายการค้าหรือบริการด้วย เพื่อความคุ้มครองที่ชัดเจนและบังคับใช้ได้ง่ายขึ้น"], en: ["No registration is required for the right to arise, but keep continuous evidence of use", "Consider also registering the same name as a trademark or service mark for clearer, more enforceable protection"] },
      overlap: { th: ["หากใช้ชื่อเดียวกันติดบนสินค้าหรือในการให้บริการด้วย ควรพิจารณาจดทะเบียนเป็นเครื่องหมายการค้าหรือบริการควบคู่กัน"], en: ["If the same name is also placed on goods or used in providing services, consider registering it as a trademark or service mark as well"] } },

    literary_general: { title: { th: "ลิขสิทธิ์ — งานทั่วไป", en: "Copyright — General Works" }, icon: "copyright", roadmap: "copyright",
      desc: { th: "ครอบคลุมงานเขียน โปรแกรมคอมพิวเตอร์ บทเพลง ท่าเต้น ภาพวาด ประติมากรรม ภาพพิมพ์ และงานสถาปัตยกรรม", en: "Covers writing, computer software, music, choreography, painting, sculpture, prints, and architectural works." },
      law: { th: "พระราชบัญญัติลิขสิทธิ์ พ.ศ. 2537", en: "Copyright Act B.E. 2537 (1994)" },
      term: { th: "ตลอดอายุผู้สร้างสรรค์ บวกอีก 50 ปีหลังเสียชีวิต (หากผู้สร้างสรรค์เป็นนิติบุคคลหรือไม่ปรากฏชื่อผู้สร้างสรรค์ ใช้ 50 ปีนับแต่สร้างสรรค์แทน)", en: "Life of the creator plus 50 years after death (if the creator is a legal entity or unnamed, 50 years from creation instead)" },
      advice: { th: ["สิทธิเกิดขึ้นโดยอัตโนมัติทันทีที่สร้างสรรค์ผลงาน ไม่ต้องยื่นจดทะเบียน", "แนะนำแจ้งข้อมูลลิขสิทธิ์ต่อกรมทรัพย์สินทางปัญญาไว้เป็นหลักฐานวันที่สร้างสรรค์", "งานต้องเกิดจากความคิดริเริ่มของตนเอง ไม่ใช่การคัดลอกผลงานผู้อื่น"], en: ["The right arises automatically the moment the work is created; no registration required", "It is advisable to notify the DIP of copyright details as evidence of the creation date", "The work must originate from your own effort, not be copied from someone else"] },
      overlap: { th: ["หากเป็นโปรแกรมคอมพิวเตอร์ที่มีกระบวนการทางเทคนิคใหม่และแก้ปัญหาทางเทคนิค อาจพิจารณาสิทธิบัตรกระบวนการเพิ่มเติมได้ ส่วนตัวโค้ดเองยังคงได้รับความคุ้มครองลิขสิทธิ์เสมอ", "หากงานสถาปัตยกรรมมีรูปลักษณ์ที่นำไปใช้เป็นเครื่องหมายทางการค้าด้วย อาจพิจารณาจดทะเบียนเครื่องหมายการค้าเพิ่มเติม"], en: ["If the software involves a new technical process that solves a technical problem, a process patent may also be worth considering; the code itself always remains protected by copyright", "If an architectural work look is also used as a trademark, consider registering it as a trademark as well"] } },
    photograph: { title: { th: "ลิขสิทธิ์ — งานภาพถ่าย", en: "Copyright — Photographic Work" }, icon: "copyright", roadmap: "copyright",
      desc: { th: "ภาพถ่ายที่เกิดจากการสร้างสรรค์ของช่างภาพ กฎหมายกำหนดระยะเวลาคุ้มครองไว้เป็นการเฉพาะ สั้นกว่างานวรรณกรรมทั่วไป", en: "A photograph created by a photographer. The law sets a specific, shorter protection term than for general literary works." },
      law: { th: "พระราชบัญญัติลิขสิทธิ์ พ.ศ. 2537 มาตรา 21", en: "Copyright Act B.E. 2537 (1994), Section 21" },
      term: { th: "50 ปีนับแต่ได้สร้างสรรค์ขึ้น หรือนับแต่เผยแพร่ครั้งแรกหากเผยแพร่ภายใน 50 ปีหลังสร้างสรรค์", en: "50 years from creation, or from first publication if published within 50 years of creation" },
      advice: { th: ["สิทธิเกิดขึ้นโดยอัตโนมัติ ไม่ต้องยื่นจดทะเบียน", "เก็บไฟล์ต้นฉบับและข้อมูลวันที่ถ่ายภาพไว้เป็นหลักฐานความเป็นเจ้าของ"], en: ["The right arises automatically; no registration required", "Keep the original file and shooting date as evidence of ownership"] },
      overlap: { th: ["หากนำภาพถ่ายไปใช้เป็นส่วนหนึ่งของโลโก้หรือตราสินค้า อาจพิจารณาจดทะเบียนเครื่องหมายการค้าเพิ่มเติม"], en: ["If the photograph is used as part of a logo or brand, consider registering a trademark as well"] } },
    applied_art: { title: { th: "ลิขสิทธิ์ — ศิลปประยุกต์", en: "Copyright — Applied Art" }, icon: "copyright", roadmap: "copyright",
      desc: { th: "งานออกแบบที่นำศิลปะไปใช้กับสินค้าอุตสาหกรรม เช่น ลวดลายบนสิ่งทอ หรือรูปทรงเฟอร์นิเจอร์ที่มีคุณค่าทางศิลปะ กฎหมายกำหนดระยะเวลาคุ้มครองสั้นกว่างานศิลปกรรมทั่วไปอย่างชัดเจน", en: "A design applying art to an industrial product, e.g. a textile pattern or an artistically valuable furniture shape. The law sets a notably shorter term than general artistic works." },
      law: { th: "พระราชบัญญัติลิขสิทธิ์ พ.ศ. 2537 มาตรา 22", en: "Copyright Act B.E. 2537 (1994), Section 22" },
      term: { th: "25 ปีนับแต่ได้สร้างสรรค์ขึ้น หรือนับแต่เผยแพร่ครั้งแรกหากเผยแพร่ภายใน 25 ปีหลังสร้างสรรค์", en: "25 years from creation, or from first publication if published within 25 years of creation" },
      advice: { th: ["สิทธิเกิดขึ้นโดยอัตโนมัติ ไม่ต้องยื่นจดทะเบียน", "หากต้องการความคุ้มครองที่แข็งแรงกว่าและตรวจสอบได้ชัดเจน ควรพิจารณาสิทธิบัตรการออกแบบผลิตภัณฑ์ควบคู่กัน"], en: ["The right arises automatically; no registration required", "For stronger, more clearly enforceable protection, consider also seeking a design patent"] },
      overlap: { th: ["งานออกแบบชิ้นเดียวกันอาจขอสิทธิบัตรการออกแบบผลิตภัณฑ์ได้ด้วย หากยังไม่เคยเปิดเผยต่อสาธารณะก่อนยื่นคำขอ และให้ผลคุ้มครองที่หนักแน่นกว่าในระยะเวลา 10 ปี"], en: ["The same design may also qualify for a design patent if it has not yet been publicly disclosed before filing, giving 10 years of stronger protection"] } },
    audiovisual_group: { title: { th: "ลิขสิทธิ์ — โสตทัศนวัสดุ ภาพยนตร์ และสิ่งบันทึกเสียง", en: "Copyright — Audiovisual, Film & Sound Recording" }, icon: "copyright", roadmap: "copyright",
      desc: { th: "ครอบคลุมวิดีโอ ภาพยนตร์ เพลงที่บันทึกเสียงแล้ว และรายการที่แพร่ภาพหรือแพร่เสียง แต่ละประเภทนับอายุความคุ้มครองจากวันสร้างสรรค์หรือเผยแพร่ ไม่ใช่จากอายุผู้สร้างสรรค์", en: "Covers video, film, recorded songs, and broadcast programmes. Each counts its term from the date of creation or publication, not from the creator's lifespan." },
      law: { th: "พระราชบัญญัติลิขสิทธิ์ พ.ศ. 2537 มาตรา 21", en: "Copyright Act B.E. 2537 (1994), Section 21" },
      term: { th: "50 ปีนับแต่สร้างสรรค์ขึ้น หรือนับแต่เผยแพร่/แพร่ภาพแพร่เสียงครั้งแรกภายใน 50 ปีหลังสร้างสรรค์", en: "50 years from creation, or from first publication/broadcast if within 50 years of creation" },
      advice: { th: ["สิทธิเกิดขึ้นโดยอัตโนมัติ ไม่ต้องยื่นจดทะเบียน", "หากมีการแสดงของนักแสดงหรือนักดนตรีร่วมอยู่ในงาน สิทธิของนักแสดงเป็นสิทธิแยกต่างหากที่ต้องพิจารณาเพิ่มเติม"], en: ["The right arises automatically; no registration required", "If performers or musicians appear in the work, their performer's right is a separate right that needs separate consideration"] },
      overlap: { th: ["นักแสดง นักดนตรี หรือนักร้องที่ปรากฏในงาน มีสิทธิของนักแสดงแยกต่างหากจากลิขสิทธิ์ในตัวงาน", "หากมีดนตรีประกอบหรือบทประพันธ์ที่แต่งขึ้นใหม่ งานเหล่านั้นมีลิขสิทธิ์ของตนเองแยกจากตัวภาพยนตร์หรือสิ่งบันทึกเสียง"], en: ["Performers, musicians, or singers appearing in the work hold a performer's right separate from copyright in the work itself", "Newly composed music or scripts used in the work carry their own separate copyright from the film or sound recording"] } },
    performer_right: { title: { th: "สิทธิของนักแสดง", en: "Performer's Right (Neighbouring Right)" }, icon: "performer", roadmap: "copyright",
      desc: { th: "คุ้มครองการแสดงของนักแสดง นักดนตรี นักร้อง หรือนักเต้น แยกต่างหากจากลิขสิทธิ์ในตัวบทประพันธ์หรือดนตรีกรรมที่นำมาแสดง", en: "Protects the performance of an actor, musician, singer, or dancer, separately from copyright in the script or music being performed." },
      law: { th: "พระราชบัญญัติลิขสิทธิ์ พ.ศ. 2537 หมวดสิทธิของนักแสดง", en: "Copyright Act B.E. 2537 (1994), performer's rights provisions" },
      term: { th: "50 ปีนับแต่วันที่มีการแสดง", en: "50 years from the date of the performance" },
      advice: { th: ["สิทธิเกิดขึ้นโดยอัตโนมัติเมื่อมีการแสดง ไม่ต้องยื่นจดทะเบียน", "หากการแสดงถูกบันทึกเป็นวิดีโอหรือเสียง ควรตกลงเรื่องการอนุญาตใช้สิทธิกับผู้บันทึกให้ชัดเจนตั้งแต่ต้น"], en: ["The right arises automatically upon performance; no registration required", "If the performance is recorded, agree on licensing terms with the recording party clearly from the start"] },
      overlap: { th: ["บทเพลงหรือบทประพันธ์ที่นำมาแสดงมีลิขสิทธิ์ของผู้ประพันธ์แยกต่างหาก ต้องขออนุญาตก่อนนำไปแสดงหรือบันทึกเผยแพร่"], en: ["The song or script being performed has its own separate copyright held by its author; permission is needed before performing or recording it for release"] } },

    trade_secret: { title: { th: "ความลับทางการค้า", en: "Trade Secret" }, icon: "trade_secret", roadmap: "secret",
      desc: { th: "คุ้มครองข้อมูลทางธุรกิจหรือทางเทคนิคที่มีมูลค่าทางการค้าเพราะไม่เป็นที่รู้จักทั่วไป และเจ้าของได้ใช้มาตรการรักษาความลับตามสมควร", en: "Protects business or technical information that has commercial value because it is not generally known, where the owner has taken reasonable measures to keep it confidential." },
      law: { th: "พระราชบัญญัติความลับทางการค้า พ.ศ. 2545", en: "Trade Secrets Act B.E. 2545 (2002)" },
      term: { th: "ไม่มีกำหนดเวลาสิ้นสุด คุ้มครองตราบเท่าที่ยังคงเป็นความลับอยู่", en: "No fixed end date; protected for as long as it remains secret" },
      advice: { th: ["ไม่ต้องยื่นจดทะเบียน แต่ต้องพิสูจน์ได้ว่ามีมาตรการรักษาความลับจริง", "จัดทำสัญญาห้ามเปิดเผยข้อมูล (NDA) กับพนักงานและคู่ค้าที่เกี่ยวข้อง", "จำกัดการเข้าถึงข้อมูลเฉพาะผู้ที่จำเป็นต้องรู้เท่านั้น"], en: ["No registration required, but you must be able to prove real confidentiality measures were taken", "Put NDAs in place with relevant employees and business partners", "Restrict access to the information to only those who need to know"] },
      overlap: { th: ["หากภายหลังต้องการเปิดเผยข้อมูลทางเทคนิคต่อสาธารณะ ควรพิจารณายื่นขอสิทธิบัตรก่อนเปิดเผย เพราะการเปิดเผยจะทำให้ขอสิทธิบัตรไม่ได้อีกต่อไป"], en: ["If you later want to disclose the technical information publicly, consider filing for a patent before disclosure, since disclosure will make patenting impossible afterwards"] } },

    patent_excluded: { title: { th: "ไม่เข้าข่ายรับสิทธิบัตร", en: "Statutorily Excluded from Patent Protection" }, icon: "excluded", warn: true, roadmap: null,
      desc: { th: "กฎหมายสิทธิบัตรไทยยกเว้นไม่ให้ความคุ้มครองแก่การค้นพบตามธรรมชาติ ทฤษฎีทางวิทยาศาสตร์ วิธีการทางคณิตศาสตร์ กฎเกณฑ์ทางธุรกิจหรือเกมส์ โปรแกรมคอมพิวเตอร์ล้วน ๆ ที่ไม่ผูกกับกระบวนการทางเทคนิค วิธีวินิจฉัยหรือรักษาโรคในคนหรือสัตว์ และจุลชีพหรือส่วนประกอบของจุลชีพที่พบตามธรรมชาติ", en: "Thai patent law excludes from protection: natural discoveries, scientific theories, mathematical methods, business methods or game rules, computer software alone with no attached technical process, methods of diagnosing or treating humans or animals, and microorganisms or their parts found in nature." },
      law: { th: "พระราชบัญญัติสิทธิบัตร พ.ศ. 2522 มาตรา 9", en: "Patent Act B.E. 2522 (1979), Section 9" }, term: { th: "-", en: "-" },
      advice: { th: ["หากเป็นโปรแกรมคอมพิวเตอร์ ตัวโค้ดยังคงได้รับความคุ้มครองลิขสิทธิ์โดยอัตโนมัติอยู่แล้ว", "หากเป็นกรรมวิธีหรือข้อมูลที่ยังไม่เปิดเผยต่อสาธารณะ อาจพิจารณาคุ้มครองเป็นความลับทางการค้าแทน", "ลองทบทวนว่ามีองค์ประกอบทางเทคนิคที่นำไปแก้ปัญหาเชิงกายภาพหรืออุตสาหกรรมร่วมอยู่ด้วยหรือไม่ เพราะส่วนนั้นอาจยังขอสิทธิบัตรได้"], en: ["If it is computer software, the code itself is already automatically protected by copyright", "If it is an undisclosed process or data, consider protecting it as a trade secret instead", "Reconsider whether there is a technical element solving a physical or industrial problem attached, as that part may still be patentable"] }, overlap: { th: [], en: [] } },
    patent_novelty_lost: { title: { th: "ความใหม่อาจเสียไปแล้ว", en: "Novelty Likely Destroyed by Prior Disclosure" }, icon: "excluded", warn: true, roadmap: null,
      desc: { th: "การเปิดเผยสิ่งประดิษฐ์ต่อสาธารณะเกิน 12 เดือน หรือเปิดเผยโดยบุคคลอื่นที่ไม่ใช่ผู้ประดิษฐ์เอง มักทำให้สิ่งประดิษฐ์ไม่ถือว่าใหม่อีกต่อไปตามกฎหมายสิทธิบัตร แม้จะมีขั้นการประดิษฐ์สูงเพียงใดก็ตาม", en: "Disclosing an invention publicly more than 12 months ago, or disclosure by someone other than the inventor, usually means the invention is no longer considered new under patent law, regardless of how high the inventive step is." },
      law: { th: "พระราชบัญญัติสิทธิบัตร พ.ศ. 2522 มาตรา 6", en: "Patent Act B.E. 2522 (1979), Section 6" }, term: { th: "-", en: "-" },
      advice: { th: ["ตรวจสอบวันที่เปิดเผยและช่องทางที่ใช้สิทธิยกเว้นความใหม่ (ระยะเวลาผ่อนผัน 12 เดือน) อย่างละเอียดกับผู้เชี่ยวชาญก่อนสรุปผล", "หากมีส่วนของสิ่งประดิษฐ์ที่ยังไม่เคยเปิดเผย อาจยังยื่นขอสิทธิบัตรเฉพาะส่วนนั้นได้", "พิจารณาคุ้มครองด้วยความลับทางการค้าสำหรับรายละเอียดส่วนที่ยังไม่เปิดเผยต่อไป"], en: ["Have a professional carefully verify the disclosure date and channel against the 12-month grace period exception before concluding anything", "If part of the invention has never been disclosed, that part may still be patentable", "Consider protecting the undisclosed details as a trade secret going forward"] }, overlap: { th: [], en: [] } },
    patent_invention: { title: { th: "สิทธิบัตรการประดิษฐ์", en: "Invention Patent" }, icon: "patent_invention", roadmap: "patent",
      desc: { th: "คุ้มครองสิ่งประดิษฐ์ใหม่ที่มีขั้นการประดิษฐ์สูงขึ้น และสามารถประยุกต์ใช้ในทางอุตสาหกรรมได้", en: "Protects a new invention with an elevated inventive step that can be applied industrially." },
      law: { th: "พระราชบัญญัติสิทธิบัตร พ.ศ. 2522", en: "Patent Act B.E. 2522 (1979)" }, term: { th: "20 ปีนับจากวันยื่นคำขอ ไม่ต่ออายุ", en: "20 years from the filing date, not renewable" },
      advice: { th: ["ต้องยื่นคำขอก่อนเปิดเผยสิ่งประดิษฐ์ต่อสาธารณะ มิฉะนั้นอาจเสียความใหม่", "ตรวจสอบงานที่มีอยู่ก่อน (prior art) เพื่อประเมินความใหม่และขั้นการประดิษฐ์อย่างละเอียด", "ยื่นคำขอต่อกรมทรัพย์สินทางปัญญา และเตรียมรายละเอียดการประดิษฐ์ให้ครบถ้วน"], en: ["File before publicly disclosing the invention, or novelty may be lost", "Conduct a careful prior art search to assess novelty and inventive step", "File with the Department of Intellectual Property with complete invention details"] },
      overlap: { th: ["ระหว่างขั้นตอนการยื่นและพิจารณาคำขอซึ่งใช้เวลานาน ควรคุ้มครองรายละเอียดทางเทคนิคที่ยังไม่เปิดเผยไว้เป็นความลับทางการค้าคู่ขนาน", "ชื่อทางการค้าของผลิตภัณฑ์ที่ใช้สิ่งประดิษฐ์นี้ควรพิจารณาจดทะเบียนเป็นเครื่องหมายการค้าแยกต่างหาก"], en: ["While the lengthy filing and examination process is ongoing, protect any still-undisclosed technical details as a trade secret in parallel", "The brand name of a product using this invention should be considered for separate trademark registration"] } },
    petty_patent: { title: { th: "อนุสิทธิบัตร", en: "Petty Patent" }, icon: "petty_patent", roadmap: "patent",
      desc: { th: "คุ้มครองสิ่งประดิษฐ์ที่ใหม่ แต่เป็นการปรับปรุงหรือพัฒนาต่อยอดในระดับที่ไม่สูงมากเมื่อเทียบกับสิทธิบัตรการประดิษฐ์ กระบวนการตรวจสอบและออกความคุ้มครองรวดเร็วกว่า", en: "Protects a new invention that is a smaller-scale improvement compared to an invention patent. Examination and grant is faster." },
      law: { th: "พระราชบัญญัติสิทธิบัตร พ.ศ. 2522 (หมวดอนุสิทธิบัตร)", en: "Patent Act B.E. 2522 (1979), petty patent provisions" }, term: { th: "6 ปีนับจากวันจดทะเบียน ต่ออายุได้ 2 ครั้ง ครั้งละ 2 ปี รวมสูงสุด 10 ปี", en: "6 years from registration, renewable twice for 2 years each, up to a maximum of 10 years" },
      advice: { th: ["เหมาะกับสิ่งประดิษฐ์ที่เป็นการปรับปรุงจากของเดิม ไม่จำเป็นต้องมีขั้นการประดิษฐ์สูง", "ยื่นคำขอต่อกรมทรัพย์สินทางปัญญา ใช้เวลาออกความคุ้มครองเร็วกว่าสิทธิบัตรทั่วไป", "ภายหลังสามารถยื่นเปลี่ยนเป็นสิทธิบัตรการประดิษฐ์ได้ภายในระยะเวลาที่กฎหมายกำหนด หากคุณสมบัติครบ"], en: ["Suitable for inventions that improve on existing ones without needing a high inventive step", "File with the Department of Intellectual Property; grant is faster than a full patent", "Can later be converted to an invention patent within the statutory deadline if it qualifies"] },
      overlap: { th: ["ชื่อทางการค้าของผลิตภัณฑ์ที่ใช้สิ่งประดิษฐ์นี้ควรพิจารณาจดทะเบียนเป็นเครื่องหมายการค้าแยกต่างหาก"], en: ["The brand name of a product using this invention should be considered for separate trademark registration"] } },
    design_patent: { title: { th: "สิทธิบัตรการออกแบบผลิตภัณฑ์", en: "Design Patent" }, icon: "design_patent", roadmap: "design",
      desc: { th: "คุ้มครองรูปร่าง ลักษณะภายนอก ลวดลาย หรือองค์ประกอบของสีที่ปรากฏบนผลิตภัณฑ์ โดยไม่คุ้มครองการทำงานหรือฟังก์ชันของผลิตภัณฑ์", en: "Protects the shape, external appearance, pattern, or colour composition of a product, not its function or how it works." },
      law: { th: "พระราชบัญญัติสิทธิบัตร พ.ศ. 2522 (หมวดการออกแบบผลิตภัณฑ์)", en: "Patent Act B.E. 2522 (1979), design patent provisions" }, term: { th: "10 ปีนับจากวันยื่นคำขอ", en: "10 years from the filing date" },
      advice: { th: ["ต้องเป็นการออกแบบใหม่ ยังไม่เคยเปิดเผยต่อสาธารณะมาก่อนยื่นคำขอ", "เตรียมภาพหรือแบบแสดงรูปลักษณ์ผลิตภัณฑ์ทุกด้านให้ชัดเจนสำหรับยื่นคำขอ", "หากผลิตภัณฑ์มีทั้งฟังก์ชันใหม่และการออกแบบใหม่ อาจพิจารณายื่นทั้งสิทธิบัตรการประดิษฐ์และการออกแบบคู่กัน"], en: ["Must be a new design, not publicly disclosed before filing", "Prepare clear drawings or images showing the product from every angle", "If the product has both a new function and a new design, consider filing both an invention and a design patent"] },
      overlap: { th: ["รูปลักษณ์เดียวกันอาจได้รับความคุ้มครองลิขสิทธิ์ในฐานะศิลปประยุกต์โดยอัตโนมัติควบคู่ไปด้วย แม้จะมีระยะเวลาคุ้มครองสั้นกว่า", "หากรูปทรงนั้นถูกใช้เป็นสัญลักษณ์บ่งบอกแบรนด์อย่างต่อเนื่องจนผู้บริโภคจดจำได้ อาจขอจดทะเบียนเป็นเครื่องหมายการค้าสามมิติเพิ่มเติมได้ในระยะยาว"], en: ["The same appearance may automatically also enjoy copyright protection as applied art, though with a shorter term", "If the shape is used consistently as a brand identifier that consumers come to recognise, a three-dimensional trademark may be registrable in the long run"] } },
    ic_layout: { title: { th: "แบบผังภูมิของวงจรรวม", en: "IC Layout Design" }, icon: "ic_layout", roadmap: "ic",
      desc: { th: "คุ้มครองแบบผังการจัดวางวงจรอิเล็กทรอนิกส์บนวงจรรวมหรือเซมิคอนดักเตอร์ ที่เกิดจากความคิดสร้างสรรค์ของผู้ออกแบบเอง", en: "Protects the layout design of an electronic circuit on an integrated circuit or semiconductor that results from the designer's own creativity." },
      law: { th: "พระราชบัญญัติคุ้มครองแบบผังภูมิของวงจรรวม พ.ศ. 2543", en: "Integrated Circuit Layout Design Protection Act B.E. 2543 (2000)" }, term: { th: "10 ปีนับจากวันจดทะเบียน หรือวันที่มีการผลิตทางการค้าครั้งแรก แล้วแต่วันใดถึงก่อน", en: "10 years from registration, or from first commercial exploitation, whichever comes first" },
      advice: { th: ["ต้องยื่นคำขอภายในระยะเวลาที่กฎหมายกำหนดหลังจากมีการผลิตหรือเปิดเผยทางการค้าครั้งแรก", "แบบผังภูมิต้องเกิดจากความคิดสร้างสรรค์ของผู้ออกแบบเอง ไม่ใช่การคัดลอก", "ยื่นคำขอต่อกรมทรัพย์สินทางปัญญาพร้อมเอกสารแสดงแบบผังภูมิ"], en: ["Must file within the statutory deadline after first commercial production or disclosure", "The layout design must be the designer's own creative work, not copied", "File with the DIP together with documents showing the layout design"] },
      overlap: { th: ["หากภายในวงจรมีกรรมวิธีการผลิตที่เป็นความลับ อาจคุ้มครองส่วนนั้นเป็นความลับทางการค้าเพิ่มเติมได้"], en: ["If the circuit involves a secret manufacturing process, that part may also be protected as a trade secret"] } },

    new_variety: { title: { th: "พันธุ์พืชใหม่", en: "New Plant Variety" }, icon: "plant_variety", roadmap: "plant_new",
      desc: { th: "พันธุ์พืชที่ได้จากการปรับปรุงพันธุ์ มีความสม่ำเสมอและคงตัว และมีลักษณะแตกต่างจากพันธุ์ที่มีอยู่เดิมอย่างชัดเจน", en: "A plant variety obtained through breeding, uniform and stable, with characteristics clearly distinct from existing varieties." },
      law: { th: "พระราชบัญญัติคุ้มครองพันธุ์พืช พ.ศ. 2542", en: "Plant Variety Protection Act B.E. 2542 (1999)" }, term: { th: "ประมาณ 12–27 ปี ขึ้นอยู่กับประเภทของพืช", en: "Approximately 12-27 years depending on the plant type" },
      advice: { th: ["ยื่นคำขอต่อกรมวิชาการเกษตร กระทรวงเกษตรและสหกรณ์", "ต้องแสดงได้ว่าพันธุ์พืชมีความใหม่ ความแตกต่าง ความสม่ำเสมอ และความคงตัว", "เตรียมข้อมูลกระบวนการปรับปรุงพันธุ์และลักษณะประจำพันธุ์ให้ครบถ้วน"], en: ["File with the Department of Agriculture, Ministry of Agriculture and Cooperatives", "Must demonstrate novelty, distinctness, uniformity, and stability", "Prepare complete data on the breeding process and the variety's characteristics"] },
      overlap: { th: ["ชื่อทางการค้าของเมล็ดพันธุ์หรือผลผลิตควรพิจารณาจดทะเบียนเป็นเครื่องหมายการค้าแยกต่างหาก"], en: ["The brand name of the seed or produce should be considered for separate trademark registration"] } },
    local_domestic: { title: { th: "พันธุ์พืชพื้นเมืองเฉพาะถิ่น", en: "Local Domestic Plant Variety" }, icon: "plant_variety", roadmap: "plant_domestic",
      desc: { th: "พันธุ์พืชที่มีอยู่เฉพาะในพื้นที่ใดพื้นที่หนึ่งของประเทศไทย และดูแลรักษาโดยชุมชนท้องถิ่นมาแต่เดิม เป็นสิทธิของชุมชนไม่ใช่สิทธิเด็ดขาดแบบสิทธิบัตร", en: "A plant variety found only in one area of Thailand, traditionally cared for by a local community. It is a community right, not an exclusive right like a patent." },
      law: { th: "พระราชบัญญัติคุ้มครองพันธุ์พืช พ.ศ. 2542", en: "Plant Variety Protection Act B.E. 2542 (1999)" }, term: { th: "ไม่มีกำหนดเวลาสิ้นสุด เป็นการขึ้นทะเบียนเพื่อดูแลและแบ่งปันผลประโยชน์", en: "No fixed end date; registration is for stewardship and benefit-sharing" },

  /* ================= Analytics (optional, offline-safe queue) =============
     Leave ANALYTICS_ENDPOINT empty to disable tracking entirely — the app
     works exactly the same either way. To enable: deploy the companion
     Google Apps Script web app, then paste its /exec URL into
     ANALYTICS_ENDPOINT and its API_TOKEN value into ANALYTICS_TOKEN below
     (both must match exactly, or every event is silently rejected).
     Data collected: which question was shown, which answer was picked,
     how long it took, and where people gave up — tied to a random session
     ID generated fresh in this browser each visit, not to any personal
     information. See the in-app notice for what this is used for.

     Offline behaviour: every event is written to localStorage FIRST
     (always works, no network needed), then a send is attempted. If the
     device has no connection right now, the event just stays queued —
     nothing is lost. The queue is retried automatically the next time
     the page loads, whenever the browser reports it is back online, and
     periodically while the page stays open. This is how data "arrives
     late" for someone using the app fully offline: it travels the next
     time that same device happens to have internet, not before. */
  var ANALYTICS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxuwuv2zVa51fsqEky8CmKo6e80vuxFO5lOg3reH5QyCes2zStEblUZK2y6mqulPSv3Gw/exec";
  var ANALYTICS_TOKEN = "ipclf2026-x9k2mQ7wZ"; // must match API_TOKEN set in the Apps Script backend
  var TREE_VERSION = "v5"; // bump this whenever TREE/RESULTS structure changes, so old and new analytics data never get silently mixed together
  var ANALYTICS_QUEUE_KEY = "ipclf_analytics_queue_v1";
  var ANALYTICS_QUEUE_MAX = 500;

  function genSessionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0, v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  var sessionId = genSessionId();
  var sessionStartAt = Date.now();
  var questionShownAt = null;
  var resultReached = false;
  var flushing = false;

  function readQueue() {
    try {
      var raw = window.localStorage.getItem(ANALYTICS_QUEUE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function writeQueue(q) {
    try { window.localStorage.setItem(ANALYTICS_QUEUE_KEY, JSON.stringify(q)); } catch (e) { /* storage unavailable; degrade silently */ }
  }

  function trackEvent(payload) {
    if (!ANALYTICS_ENDPOINT) return;
    payload.session_id = sessionId;
    payload.lang = currentLang;
    payload.tree_version = TREE_VERSION;
    payload.token = ANALYTICS_TOKEN;
    payload.queued_at = Date.now();
    var q = readQueue();
    q.push(payload);
    if (q.length > ANALYTICS_QUEUE_MAX) q = q.slice(q.length - ANALYTICS_QUEUE_MAX);
    writeQueue(q);
    flushQueue();
  }

  function flushQueue() {
    if (!ANALYTICS_ENDPOINT || flushing) return;
    if (navigator.onLine === false) return; // known offline; wait for the 'online' event instead
    var q = readQueue();
    if (!q.length) return;
    flushing = true;
    var sending = q;
    fetch(ANALYTICS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ events: sending, token: ANALYTICS_TOKEN }),
      keepalive: true
    }).then(function () {
      // best-effort: treat any completed request as delivered, then drop
      // only the events we actually sent (new ones may have queued meanwhile)
      var remaining = readQueue().slice(sending.length);
      writeQueue(remaining);
    }).catch(function () {
      /* still offline or request failed — leave the queue intact for next try */
    }).finally(function () { flushing = false; });
  }

  window.addEventListener("online", flushQueue);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && !resultReached) {
      trackEvent({ event: "session_abandon", node_id: lastView.id });
    }
  });
  window.addEventListener("pagehide", function () {
    if (!resultReached) trackEvent({ event: "session_abandon", node_id: lastView.id });
  });
  // Retry whatever piled up while offline, shortly after this load and then periodically
  setTimeout(flushQueue, 1500);
  setInterval(flushQueue, 60000);

    document.getElementById("langEn").setAttribute("aria-pressed", currentLang === "en" ? "true" : "false");

      trail.appendChild(cur);

    trailSummaryText.textContent = L(UI.stepLabel) + " " + (history.length + 1);
  }

  function updateProgress(nodeId, done) {

    node.options.forEach(function (opt, i) {
      panel.querySelector('[data-idx="' + i + '"]').addEventListener("click", function () {
        var elapsed = questionShownAt ? Math.round((Date.now() - questionShownAt) / 1000) : "";
        trackEvent({ event: "question_answered", node_id: nodeId, question: L(node.q).slice(0, 90), option: L(opt.label), time_spent_sec: elapsed });
        history.push({ nodeId: nodeId, question: L(node.q), answerLabel: L(opt.label) });
        if (nodeId === "q_disclosure" && i === 1) flags.discloseGrace = true;
        goTo(opt.next);
      });
    });
    var backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", goBack);
    document.getElementById("restartBtn").addEventListener("click", function () { restart(false); });
  }

  function renderResult(resultId) {
    var r = RESULTS[resultId];
    lastView = { type: "result", id: resultId };
    resultReached = true;
    trackEvent({ event: "result_reached", result_id: resultId, time_spent_sec: Math.round((Date.now() - sessionStartAt) / 1000) });
    renderTrail(null);
    updateProgress(null, true);

    var advice = L(r.advice).slice();
    if ((resultId === "patent_invention" || resultId === "petty_patent") && flags.discloseGrace) {
      var graceNote = currentLang === "th"
        ? "คุณเปิดเผยสิ่งประดิษฐ์นี้มาแล้วภายใน 12 เดือนโดยตัวผู้ประดิษฐ์เอง ยังสามารถยื่นขอความคุ้มครองได้โดยอ้างสิทธิข้อยกเว้นความใหม่ แต่ต้องยื่นคำขอภายในกำหนดเวลาและแนบหลักฐานการเปิดเผยประกอบคำขอให้ครบถ้วน"
        : "You disclosed this invention within the last 12 months, as the inventor personally. You may still file by invoking the novelty grace-period exception, but must file within the deadline and attach evidence of the disclosure.";
      advice.unshift(graceNote);
    }

    var html = '<div class="rcard' + (r.warn ? " warn" : "") + (reduceMotion ? '' : ' enter') + '">';
    html += '<div class="r-eyebrow">' + L(UI.resultEyebrow) + '</div>';
    html += '<div class="r-head"><div class="r-icon' + (resultId === "none" || r.warn ? " none" : "") + '">' + ICONS[r.icon] + '</div>';
    html += '<div class="r-titles"><h2>' + L(r.title) + '</h2><div class="r-en">' + (currentLang === "th" ? r.title.en : r.title.th) + '</div></div></div>';
    html += '<div class="r-disclaimer">' + WARN_ICON + '<span>' + L(UI.dashDisclaimer) + '</span></div>';
    html += '<p class="r-desc">' + L(r.desc) + '</p>';
    if (L(r.law) !== "-") {
      html += '<div class="r-facts">';
      html += '<div class="r-fact"><div class="r-fact-label">' + L(UI.factLaw) + '</div><div class="r-fact-val">' + L(r.law) + '</div></div>';
      html += '<div class="r-fact"><div class="r-fact-label">' + L(UI.factTerm) + '</div><div class="r-fact-val">' + L(r.term) + '</div></div>';
      html += '</div>';
    }
    html += '<div class="r-advice"><h3>' + L(UI.adviceHeading) + '</h3><ul>';
    advice.forEach(function (a) { html += '<li>' + a + '</li>'; });
    html += '</ul></div>';

    if (r.roadmap && ROADMAPS[r.roadmap]) {
      html += '<div class="r-roadmap"><h3>' + L(UI.roadmapHeading) + '</h3>';
      L(ROADMAPS[r.roadmap]).forEach(function (step, i) {
        html += '<div class="rm-step"><div class="rm-dot">' + (i + 1) + '</div><div class="rm-text">' + step + '</div></div>';
      });
      html += '</div>';
    }

    var overlapList = L(r.overlap);
    if (overlapList && overlapList.length) {
      html += '<div class="r-overlap"><h3>' + LINK_ICON + L(UI.overlapHeading) + '</h3><ul>';
      overlapList.forEach(function (o) { html += '<li>' + o + '</li>'; });
      html += '</ul></div>';
    }

    html += '<div class="r-actions">';
    if (history.length > 0) html += '<button class="btn" id="backBtn" type="button">' + BACK + L(UI.backEdit) + '</button>';
    html += '<button class="btn" id="addToProfileBtn" type="button">' + L(UI.addToProfileBtn) + '</button>';
    html += '<button class="btn" id="printBtn" type="button">' + PRINT_ICON + L(UI.printBtn) + '</button>';
    html += '<button class="btn" id="copyBtn" type="button">' + COPY_ICON + L(UI.copyBtn) + '</button>';
    html += '<button class="btn primary" id="restartBtn" type="button">' + L(UI.restartResult) + '</button>';
    html += '</div>';
    html += '<div class="r-actions" style="margin-top:2px;"><button class="btn" id="disagreeBtn" type="button">' + L(UI.disagreeBtn) + '</button></div>';
    html += '<div class="copy-toast" id="copyToast">' + L(UI.copiedMsg) + '</div>';
    html += '</div>';

    panel.innerHTML = html;
    focusPanelHeading();
    var backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", goBack);
    document.getElementById("restartBtn").addEventListener("click", function () { restart(false); });
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("copyBtn").addEventListener("click", function () { copySummary(r, advice, overlapList); });
    document.getElementById("addToProfileBtn").addEventListener("click", function () {
      if (!collectedResults.some(function (c) { return c.resultId === resultId; })) {
        collectedResults.push({ resultId: resultId, savedAt: Date.now() });
      }
      updateProfileButton();
      restart(true);
    });
    document.getElementById("disagreeBtn").addEventListener("click", function () {
      var note = window.prompt(L(UI.disagreePrompt), "");
      if (note === null) return; // user cancelled
      trackEvent({ event: "result_disagree", result_id: resultId, note: note.slice(0, 500) });
      var toast = document.getElementById("copyToast");
      if (toast) { toast.textContent = L(UI.disagreeThanks); toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); toast.textContent = L(UI.copiedMsg); }, 2600); }
    });
  }

  function copySummary(r, advice, overlapList) {
    var lines = [];
    lines.push(L(r.title) + " (" + (currentLang === "th" ? r.title.en : r.title.th) + ")");
    lines.push("");
    lines.push(L(r.desc));
    if (L(r.law) !== "-") {
      lines.push("");
      lines.push(L(UI.factLaw) + ": " + L(r.law));
      lines.push(L(UI.factTerm) + ": " + L(r.term));
    }
    lines.push("");
    lines.push(L(UI.adviceHeading) + ":");
    advice.forEach(function (a) { lines.push("- " + a); });
    if (overlapList && overlapList.length) {
      lines.push("");
      lines.push(L(UI.overlapHeading) + ":");
      overlapList.forEach(function (o) { lines.push("- " + o); });
    }
    lines.push("");
    lines.push(L(UI.dashDisclaimer));
    var text = lines.join("\n");
    var toast = document.getElementById("copyToast");
    function showToast() { if (toast) { toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 2200); } }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showToast, function () { fallbackCopy(text, showToast); });
      } else {
        fallbackCopy(text, showToast);
      }
    } catch (e) { fallbackCopy(text, showToast); }
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      if (cb) cb();
    } catch (e) { /* clipboard unavailable; silently ignore */ }
  }

  function renderReference() {
    var html = '<div class="refcard' + (reduceMotion ? '' : ' enter') + '">';
    html += '<h2>' + L(UI.refTitle) + '</h2>';
    html += '<p>' + L(UI.refDesc) + '</p>';
    html += '<div class="ref-grid">';
    REF_ORDER.forEach(function (id) {
      var r = RESULTS[id];
      html += '<div class="ref-item">';
      html += '<div class="ref-item-head"><div class="ri">' + ICONS[r.icon] + '</div><strong>' + L(REF_LABELS[id]) + '</strong></div>';
      html += '<p>' + L(r.desc) + '</p>';
      html += '<div class="ref-term">' + L(r.term) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="r-actions"><button class="btn primary" id="refBackBtn" type="button">' + L(UI.refBack) + '</button></div>';
    html += '</div>';
    panel.innerHTML = html;
    focusPanelHeading();
    document.getElementById("refBackBtn").addEventListener("click", restoreLastView);
  }

  function updateProfileButton() {
    var btn = document.getElementById("profileToggle");
    var label = document.getElementById("profileToggleLabel");
    if (!btn) return;
    if (collectedResults.length > 0) {
      btn.style.display = "";
      label.textContent = L(UI.myProfileBtn) + " (" + collectedResults.length + ")";
    } else {
      btn.style.display = "none";
    }
  }

  function renderProfile() {
    var html = '<div class="refcard' + (reduceMotion ? '' : ' enter') + '">';
    html += '<h2>' + L(UI.profileTitle) + '</h2>';
    html += '<p>' + L(UI.profileDesc) + '</p>';
    if (!collectedResults.length) {
      html += '<p class="empty-note">' + L(UI.profileEmpty) + '</p>';
    } else {
      html += '<div class="ref-grid">';
      collectedResults.forEach(function (item) {
        var r = RESULTS[item.resultId];
        html += '<div class="ref-item">';
        html += '<div class="ref-item-head"><div class="ri">' + ICONS[r.icon] + '</div><strong>' + L(r.title) + '</strong></div>';
        html += '<p>' + L(r.desc) + '</p>';
        html += '<div class="ref-term">' + L(r.term) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '<div class="r-actions"><button class="btn primary" id="profileBackBtn" type="button">' + L(UI.profileBack) + '</button></div>';
    html += '</div>';
    panel.innerHTML = html;
    focusPanelHeading();
    var backBtn = document.getElementById("profileBackBtn");
    if (backBtn) backBtn.addEventListener("click", restoreLastView);
  }

  function focusPanelHeading() {
    var heading = panel.querySelector("h2, .q-text");
    if (!heading) return;
    try {
      heading.setAttribute("tabindex", "-1");
      heading.focus({ preventScroll: true });
    } catch (e) { /* focus is a nicety, never let it break rendering */ }
  }

  function restoreLastView() {
    if (lastView.type === "result") renderResult(lastView.id);
    else renderQuestion(lastView.id);
  }

  function goTo(next) {
    if (next.indexOf("result:") === 0) renderResult(next.slice(7));
    else renderQuestion(next);
    panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }

  function goBack() {
    var last = history.pop();
    if (!last) return;
    trackEvent({ event: "back_clicked", node_id: lastView.id });
    if (last.nodeId === "q_disclosure") flags.discloseGrace = false;
    renderQuestion(last.nodeId);
  }

  function restart(preserveProfile) {
    if (history.length > 0 || resultReached) trackEvent({ event: preserveProfile ? "explore_another_clicked" : "restart_clicked", node_id: lastView.id });
    history = [];
    flags = { discloseGrace: false };
    resultReached = false;
    if (!preserveProfile) collectedResults = [];
    renderQuestion("start");
    updateProfileButton();
  }

  function setLang(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    setStaticText();
    var wasRef = panel.querySelector(".refcard") !== null;
    if (wasRef) renderReference(); else restoreLastView();
  }

  document.getElementById("refToggle").addEventListener("click", renderReference);
  document.getElementById("profileToggle").addEventListener("click", renderProfile);
  document.getElementById("langTh").addEventListener("click", function () { setLang("th"); });
  document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });

  setStaticText();
  trackEvent({ event: "session_start" });
  restart(false);
})();
</script>
</body>
</html>
